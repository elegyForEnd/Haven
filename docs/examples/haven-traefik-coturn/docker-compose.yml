# ── Haven + Traefik + TURN ───────────────────────────────
# Quick start:  docker compose up -d
# Stop:         docker compose down
# Logs:         docker compose logs -f
#
# Before first run:  docker network create proxy
# ─────────────────────────────────────────────────────────

services:
  traefik:
    image: ghcr.io/traefik/traefik:3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --serversTransport.insecureSkipVerify=true
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - proxy

  haven:
    image: haven-local:dev
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: haven
    restart: unless-stopped
    volumes:
      - haven_data:/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - BILIBILI_VIDEO_MAX_HEIGHT=1080
      - BILIBILI_HLS_ENABLED=true
      - BILIBILI_HLS_MAX_CONCURRENT=2
      - BILIBILI_HLS_SEGMENT_SECONDS=4
      - BILIBILI_HLS_MAX_SESSION_BYTES=1073741824
      - BILIBILI_HLS_MAX_TOTAL_BYTES=5368709120
      - BILIBILI_PROXY_MAX_CONCURRENT=24
      - BILIBILI_PROXY_RESERVED_AUDIO=8
      - BILIBILI_PROXY_TIMEOUT_MS=30000
      - SERVER_NAME=${SERVER_NAME}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - TURN_URL=turn:${DOMAIN}:3478
      - TURN_SECRET=${TURN_SECRET}
      - HAVEN_EASYTIER_HOST=${HAVEN_EASYTIER_HOST:-}
      - HAVEN_EASYTIER_PORT=${HAVEN_EASYTIER_PORT:-11010}
      - HAVEN_EASYTIER_SECRET=${HAVEN_EASYTIER_SECRET:-}
      - HAVEN_EASYTIER_NETWORK_PREFIX=${HAVEN_EASYTIER_NETWORK_PREFIX:-}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.haven.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.haven.entrypoints=websecure
      - traefik.http.routers.haven.tls.certresolver=letsencrypt
      - traefik.http.services.haven.loadbalancer.server.port=3000
      - traefik.http.services.haven.loadbalancer.server.scheme=https
      - traefik.http.routers.haven.service=haven

  easytier:
    profiles: [easytier]
    image: ghcr.io/easytier/easytier:v2.6.4@sha256:91d6732ea5ff71542fdb99333d2ee7b168e973443114db84db061e452427d91e
    restart: unless-stopped
    network_mode: host
    logging:
      driver: none
    command:
      - --network-name
      - haven-coordinator
      - --no-tun
      - --disable-ipv6
      - --secure-mode
      - "true"
      - --relay-network-whitelist
      - haven-${HAVEN_EASYTIER_NETWORK_PREFIX:-disabled}-*
      - --foreign-relay-bps-limit
      - "20000000"
      - --listeners
      - udp://0.0.0.0:${HAVEN_EASYTIER_PORT:-11010}
      - tcp://0.0.0.0:${HAVEN_EASYTIER_PORT:-11010}
    environment:
      - ET_NETWORK_SECRET=${HAVEN_EASYTIER_COORDINATOR_SECRET:-}

  coturn:
    image: ghcr.io/coturn/coturn:4.9
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --tls-listening-port=5349
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --min-port=49152
      - --max-port=65535

volumes:
  haven_data:
  traefik_certs:

networks:
  proxy:
